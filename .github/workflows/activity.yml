name: Profile activity

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Render activity card from the GitHub API
        env:
          # Optional METRICS_TOKEN (classic PAT, read:user) also counts private contributions.
          GITHUB_TOKEN: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          pip install --quiet fonttools uharfbuzz
          python scripts/stats.py dist

      - name: Publish to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
          commit_message: "chore: update profile activity"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Point the README at the fresh images
        # GitHub caches README images, so a new ?v= stamp forces it to fetch today's cards.
        # Pushes made with GITHUB_TOKEN do not trigger workflows, so this cannot loop.
        run: |
          v=$(date -u +%Y%m%d%H%M)
          sed -i -E "s#(output/activity-[a-z]+-(dark|light)\.svg)(\?v=[0-9]+)?#\1?v=$v#g" README.md
          if [ -n "$(git status --porcelain README.md)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898888+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore: refresh activity images" README.md
            git pull --rebase origin main
            git push origin HEAD:main
          fi
