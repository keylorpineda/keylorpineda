name: Monthly rebuild

on:
  schedule:
    - cron: "23 7 1 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Rebuild README and static cards
        run: |
          pip install --quiet fonttools uharfbuzz
          python scripts/build.py

      - name: Commit if anything changed
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898888+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "chore: monthly profile rebuild"
            git push
          else
            echo "Nothing changed this month."
          fi
